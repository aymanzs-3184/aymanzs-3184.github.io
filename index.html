<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ayman Z.S Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Projects, experience and skills of Ayman Z.S, Computer Science student at Monash University.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a workbench index — a left-aligned intro, a skills rail that filters a grid of project cards, then the paper trail (experience, certificates, contact). */
:root {
  --paper: #eef2f0;
  --card: #ffffff;
  --ink: #15201d;
  --muted: #586661;
  --line: #d3dbd8;
  --accent: #1d6b58;
  --accent-ink: #ffffff;
  --accent-soft: #dcebe5;
  --mark: #f0cf4f;
  --mark-ink: #2a2405;
  --shadow: 0 1px 2px rgba(21, 32, 29, .06), 0 6px 20px rgba(21, 32, 29, .06);
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0e1412; --card: #151d1a; --ink: #e3ebe8; --muted: #93a39e; --line: #26312d;
    --accent: #5ec9a8; --accent-ink: #0e1412; --accent-soft: #1b2e28; --mark: #e6c547; --mark-ink: #1c1803;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0e1412; --card: #151d1a; --ink: #e3ebe8; --muted: #93a39e; --line: #26312d;
  --accent: #5ec9a8; --accent-ink: #0e1412; --accent-soft: #1b2e28; --mark: #e6c547; --mark-ink: #1c1803;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; animation: none !important; } }
body {
  margin: 0; background: var(--paper); color: var(--ink);
  font: 400 16px/1.6 var(--body);
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

.wrap {
  max-width: 1160px; margin: 0 auto;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
}

/* ---------- top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}
.bar .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 12px; }
.mono-name { font: 500 14px/1 var(--mono); letter-spacing: .02em; text-decoration: none; }
.nav { display: flex; gap: 18px; flex-wrap: wrap; }
.nav a { font-size: 14px; color: var(--muted); text-decoration: none; }
.nav a:hover { color: var(--ink); }
@media (max-width: 640px) { .nav a.opt { display: none; } }

/* ---------- intro ---------- */
.intro { padding-block: 56px 36px; display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 48px; align-items: end; }
@media (max-width: 860px) { .intro { grid-template-columns: 1fr; gap: 28px; padding-block: 36px 24px; } }
.eyebrow { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .14em; color: var(--accent); margin: 0 0 14px; }
h1 {
  font: 800 clamp(44px, 8vw, 88px)/.92 var(--display); letter-spacing: -.035em; margin: 0 0 18px;
  text-wrap: balance;
}
.headline { font: 500 clamp(19px, 2.2vw, 23px)/1.4 var(--body); margin: 0 0 14px; max-width: 34ch; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 62ch; }

.facts { border-top: 2px solid var(--ink); display: grid; }
.fact { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.fact dt { font: 500 12px/1.9 var(--mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.fact dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.fact a { text-decoration-color: var(--line); text-underline-offset: 3px; }
.fact a:hover { text-decoration-color: var(--accent); }
.copy {
  margin-left: 8px; font: 500 12px/1 var(--mono); padding: 4px 8px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
}
.copy:hover { border-color: var(--accent); }

/* ---------- section heads ---------- */
section { padding-block: 28px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
h2 { font: 700 clamp(26px, 3.4vw, 34px)/1.1 var(--display); letter-spacing: -.02em; margin: 0; }
.sec-note { color: var(--muted); font-size: 14px; margin: 0; }

/* ---------- skills filter ---------- */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 22px; }
.chip {
  font: 500 13px/1 var(--mono); padding: 8px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer;
  display: inline-flex; gap: 7px; align-items: center;
}
.chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.chip.more { border-style: dashed; color: var(--muted); }
.chip[aria-pressed="true"] .n { color: inherit; opacity: .75; }
.filter-status { font-size: 14px; color: var(--muted); margin: -8px 0 18px; min-height: 1.6em; }

/* ---------- project grid ---------- */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 22px; }
@media (max-width: 980px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px) { .grid { grid-template-columns: 1fr; } }

.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); display: flex; flex-direction: column; min-width: 0; overflow: hidden;
  transition: transform .18s ease, border-color .18s ease;
}
.card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }

.thumb { position: relative; aspect-ratio: 16 / 9; max-width: 100%; display: block; overflow: hidden; text-decoration: none; background: var(--accent-soft); }
.thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover {
  position: absolute; inset: 0; padding: 16px 18px; display: flex; flex-direction: column; justify-content: space-between;
  color: #fff;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.07) 0 1px, transparent 1px 22px),
    repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px 22px),
    radial-gradient(120% 90% at 85% 10%, hsl(var(--h) 55% 46%) 0%, transparent 60%),
    linear-gradient(135deg, hsl(var(--h) 45% 22%), hsl(calc(var(--h) + 40) 40% 16%));
}
.cover .k { font: 500 11px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.cover .t { font: 800 clamp(24px, 3vw, 34px)/.95 var(--display); letter-spacing: -.03em; text-wrap: balance; }
.cover .s { font: 400 12px/1.3 var(--mono); opacity: .85; }
.play {
  position: absolute; right: 12px; bottom: 12px; display: inline-flex; align-items: center; gap: 6px;
  font: 500 12px/1 var(--mono); padding: 7px 10px; border-radius: 999px;
  background: rgba(0,0,0,.62); color: #fff;
}
.play svg { width: 12px; height: 12px; fill: currentColor; }

.body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; min-width: 0; }
.meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font: 500 12px/1 var(--mono); color: var(--muted); }
.pill { padding: 4px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); text-transform: uppercase; letter-spacing: .08em; font-size: 11px; }
.pill.feat { background: var(--mark); color: var(--mark-ink); }
.card h3 { font: 700 22px/1.15 var(--display); letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.tagline { margin: 0; color: var(--ink); }
.ctx { margin: 0; font-size: 14px; color: var(--muted); }
.tech { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 0; padding: 0; list-style: none; }
.tech li { font: 400 12px/1 var(--mono); padding: 5px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted); }
.tech li.hit { border-color: var(--accent); color: var(--accent); }

details { border-top: 1px dashed var(--line); padding-top: 10px; }
summary { cursor: pointer; font: 500 13px/1.4 var(--mono); color: var(--muted); list-style: none; display: inline-flex; gap: 6px; align-items: center; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "+"; display: inline-block; width: 1ch; color: var(--accent); }
details[open] summary::before { content: "–"; }
details ul { margin: 10px 0 0; padding-left: 18px; font-size: 15px; display: grid; gap: 6px; }

.links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; padding-top: 6px; }
.btn {
  font: 500 13px/1 var(--body); text-decoration: none; padding: 9px 12px; border-radius: 7px;
  border: 1px solid var(--line); color: var(--ink); background: var(--card); display: inline-flex; align-items: center; gap: 6px;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); color: var(--accent-ink); }
.nolinks { font-size: 13px; color: var(--muted); margin-top: auto; }

/* ---------- paper trail ---------- */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; }
@media (max-width: 860px) { .two { grid-template-columns: 1fr; gap: 12px; } }
.list { list-style: none; margin: 0; padding: 0; border-top: 2px solid var(--ink); }
.list li { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
@media (max-width: 480px) { .list li { grid-template-columns: 1fr; gap: 2px; } }
.list .when { font: 400 13px/1.6 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.list .what { font-weight: 600; }
.list .where { color: var(--muted); font-size: 14px; }
.list a { text-underline-offset: 3px; text-decoration-color: var(--line); }
.list a:hover { text-decoration-color: var(--accent); }

.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 14px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); }
.mini-h { font: 500 12px/1 var(--mono); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 22px 0 10px; }

.contact { margin-block: 28px 56px; border-radius: var(--radius); background: var(--ink); color: var(--paper); padding: 32px clamp(20px, 4vw, 40px); display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; }
.contact h2 { color: var(--paper); }
.contact p { margin: 6px 0 0; opacity: .8; }
.contact .btn { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 35%, transparent); }
.contact .btn:hover { border-color: var(--paper); color: var(--paper); }
.contact .copy { background: transparent; color: var(--paper); border-color: color-mix(in srgb, var(--paper) 35%, transparent); }
.email { font: 500 15px/1.4 var(--mono); user-select: all; overflow-wrap: anywhere; }
footer { color: var(--muted); font-size: 13px; padding-block: 0 40px; }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="mono-name" href="#top" id="bar-name">Ayman Z.S</a>
    <nav class="nav" aria-label="Sections">
      <a href="#projects">Projects</a>
      <a href="#skills" class="opt">Skills</a>
      <a href="#experience" class="opt">Experience</a>
      <a href="#contact">Contact</a>
    </nav>
  </div>
</header>

<main id="top">
  <div class="wrap intro">
    <div>
      <p class="eyebrow" id="p-eyebrow">Portfolio</p>
      <h1 id="p-name">Ayman Z.S</h1>
      <p class="headline" id="p-headline"></p>
      <p class="lede" id="p-intro"></p>
    </div>
    <dl class="facts" id="p-facts"></dl>
  </div>

  <section class="wrap" id="projects" aria-labelledby="h-projects">
    <div class="sec-head">
      <h2 id="h-projects">Projects</h2>
      <p class="sec-note" id="proj-note"></p>
    </div>
    <div class="filters" id="skills" role="group" aria-label="Filter projects by skill"></div>
    <p class="filter-status" id="filter-status" aria-live="polite"></p>
    <div class="grid" id="grid"></div>
  </section>

  <section class="wrap" id="experience" aria-labelledby="h-exp">
    <div class="two">
      <div>
        <div class="sec-head"><h2 id="h-exp">Experience</h2></div>
        <ul class="list" id="exp"></ul>
      </div>
      <div>
        <div class="sec-head"><h2 id="h-certs">Certificates</h2></div>
        <ul class="list" id="certs"></ul>
        <p class="mini-h">Also comfortable with</p>
        <div class="tags" id="other"></div>
        <p class="mini-h">Strengths</p>
        <div class="tags" id="strengths"></div>
        <p class="mini-h">Interests</p>
        <div class="tags" id="interests"></div>
      </div>
    </div>
  </section>

  <div class="wrap">
    <div class="contact" id="contact">
      <div>
        <h2>Get in touch</h2>
        <p>Open to graduate and internship roles in software and IT.</p>
      </div>
      <div class="links" id="contact-links"></div>
    </div>
  </div>
</main>
<footer class="wrap" id="foot"></footer>

<script src="content.js"></script>
<script>
(function () {
  const D = window.PORTFOLIO;
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const has = (s) => typeof s === "string" && s.trim() !== "";
  const ext = 'target="_blank" rel="noopener noreferrer"';

  /* ---------- profile ---------- */
  const P = D.profile;
  document.title = P.name + " Portfolio";
  $("bar-name").textContent = P.name;
  $("p-name").textContent = P.name;
  $("p-headline").textContent = P.headline;
  $("p-intro").textContent = P.intro;

  function copyBtn(text, label) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "copy"; b.textContent = label || "Copy";
    b.addEventListener("click", () => {
      const done = () => { b.textContent = "Copied"; setTimeout(() => (b.textContent = label || "Copy"), 1600); };
      try {
        navigator.clipboard.writeText(text).then(done, () => selectNear(b));
      } catch (e) { selectNear(b); }
    });
    return b;
  }
  function selectNear(btn) {
    const el = btn.parentElement.querySelector(".email, [data-copy]");
    if (!el) return;
    const r = document.createRange(); r.selectNodeContents(el);
    const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
  }

  const facts = [
    ["Based in", esc(P.location)],
    ["Work rights", esc(P.workRights)],
    ["Email", `<span data-copy>${esc(P.email)}</span>`],
    ["GitHub", has(P.links.github) ? `<a href="${esc(P.links.github)}" ${ext}>${esc(P.links.github.replace(/^https?:\/\/(www\.)?/, "").replace(/\?.*$/, ""))}</a>` : ""],
    ["LinkedIn", has(P.links.linkedin) ? `<a href="${esc(P.links.linkedin)}" ${ext}>${esc(P.links.linkedin.replace(/^https?:\/\/(www\.)?/, ""))}</a>` : ""],
    ["Resume", has(P.links.resume) ? `<a href="${esc(P.links.resume)}" ${ext}>Download PDF</a>` : ""],
  ].filter(([, v]) => v);
  $("p-facts").innerHTML = facts.map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`).join("");
  const emailDd = $("p-facts").querySelector("[data-copy]");
  if (emailDd) emailDd.after(copyBtn(P.email));

  /* ---------- projects ---------- */
  const projects = D.projects.slice().sort((a, b) => (b.featured === true) - (a.featured === true));
  const hue = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
  const ytId = (url) => {
    if (!has(url)) return "";
    const m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
    return m ? m[1] : "";
  };
  const LINK_LABELS = [
    ["live", "Live app"], ["github", "GitHub"], ["video", "Demo video"],
    ["slides", "Slides"], ["notebook", "Notebook"], ["extra", null],
  ];

  function card(p) {
    const L = p.links || {};
    const yt = ytId(L.video);
    const img = has(p.thumbnail) ? p.thumbnail : (yt ? `https://img.youtube.com/vi/${yt}/hqdefault.jpg` : "");
    const target = [L.video, L.live, L.github].find(has) || "";
    const cover = `<div class="cover" style="--h:${hue(p.id)}">
        <span class="k">${esc(p.kind)} · ${esc(p.year)}</span>
        <span class="t">${esc(p.title)}</span>
        <span class="s">${esc((p.tech || []).slice(0, 3).join(" · "))}</span>
      </div>`;
    const media = img
      ? `<img src="${esc(img)}" alt="${esc(p.title)} preview" loading="lazy" onerror="this.replaceWith(this.nextElementSibling.content.cloneNode(true))"><template>${cover}</template>`
      : cover;
    const play = has(L.video) ? `<span class="play"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z"/></svg>Watch demo</span>` : "";
    const thumb = target
      ? `<a class="thumb" href="${esc(target)}" ${ext} aria-label="Open ${esc(p.title)}">${media}${play}</a>`
      : `<div class="thumb">${media}</div>`;

    const btns = LINK_LABELS.filter(([k]) => has(L[k])).map(([k, label], i) => {
      const text = k === "extra" ? (has(L.extraLabel) ? L.extraLabel : "More") : label;
      return `<a class="btn${i === 0 ? " primary" : ""}" href="${esc(L[k])}" ${ext}>${esc(text)}</a>`;
    }).join("");

    const el = document.createElement("article");
    el.className = "card";
    el.dataset.tech = JSON.stringify(p.tech || []);
    el.innerHTML = `${thumb}
      <div class="body">
        <div class="meta">${p.featured ? '<span class="pill feat">Featured</span>' : ""}<span class="pill">${esc(p.kind)}</span><span>${esc(p.year)}</span></div>
        <h3>${esc(p.title)}</h3>
        <p class="tagline">${esc(p.tagline)}</p>
        <p class="ctx">${esc(p.context)}</p>
        <ul class="tech">${(p.tech || []).map((t) => `<li data-t="${esc(t)}">${esc(t)}</li>`).join("")}</ul>
        ${(p.highlights || []).length ? `<details><summary>What I did</summary><ul>${p.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul></details>` : ""}
        ${btns ? `<div class="links">${btns}</div>` : `<p class="nolinks">Code and demo available on request.</p>`}
      </div>`;
    return el;
  }

  const grid = $("grid");
  const cards = projects.map((p) => { const c = card(p); grid.appendChild(c); return c; });
  const feat = projects.filter((p) => p.featured).length;
  $("proj-note").textContent = `${projects.length} projects · ${feat} featured · open any card for details`;

  /* ---------- skills = filters ---------- */
  const counts = new Map();
  projects.forEach((p) => (p.tech || []).forEach((t) => counts.set(t, (counts.get(t) || 0) + 1)));
  const skills = [...counts.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  const filters = $("skills");
  let active = null;

  function chip(label, n, value) {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.dataset.value = value ?? "";
    b.setAttribute("aria-pressed", value == null ? "true" : "false");
    b.innerHTML = `${esc(label)}<span class="n">${n}</span>`;
    b.addEventListener("click", () => apply(value ?? null));
    return b;
  }
  filters.appendChild(chip("All projects", projects.length, null));
  const extraChips = [];
  skills.forEach(([t, n]) => {
    const c = chip(t, n, t);
    if (n < 2) { c.hidden = true; extraChips.push(c); }
    filters.appendChild(c);
  });
  if (extraChips.length) {
    const more = document.createElement("button");
    more.type = "button"; more.className = "chip more";
    more.textContent = `+ ${extraChips.length} more skills`;
    more.addEventListener("click", () => {
      const open = extraChips[0].hidden;
      extraChips.forEach((c) => (c.hidden = !open && c.dataset.value !== active));
      more.textContent = open ? "Show fewer" : `+ ${extraChips.length} more skills`;
    });
    filters.appendChild(more);
  }

  function apply(value) {
    active = active === value ? null : value;
    filters.querySelectorAll(".chip").forEach((b) => b.setAttribute("aria-pressed", String((b.dataset.value || null) === active)));
    let shown = 0;
    cards.forEach((c) => {
      const tech = JSON.parse(c.dataset.tech);
      const ok = !active || tech.includes(active);
      c.hidden = !ok; if (ok) shown++;
      c.querySelectorAll(".tech li").forEach((li) => li.classList.toggle("hit", !!active && li.dataset.t === active));
    });
    $("filter-status").textContent = active ? `${shown} project${shown === 1 ? "" : "s"} built with ${active}` : "";
  }

  /* ---------- paper trail ---------- */
  $("exp").innerHTML = (D.experience || []).map((e) =>
    `<li><span class="when">${esc(e.when)}</span><span><span class="what">${esc(e.what)}</span><br><span class="where">${esc(e.where)}</span></span></li>`).join("");
  $("certs").innerHTML = (D.certifications || []).map((c) =>
    `<li><span class="when">${esc(c.date)}</span><span><span class="what">${has(c.url) ? `<a href="${esc(c.url)}" ${ext}>${esc(c.name)}</a>` : esc(c.name)}</span><br><span class="where">${esc(c.issuer)}</span></span></li>`).join("");
  const tags = (arr) => (arr || []).map((t) => `<span class="tag">${esc(t)}</span>`).join("");
  $("other").innerHTML = tags((D.otherSkills || []).filter((s) => !counts.has(s)));
  $("strengths").innerHTML = tags(D.strengths);
  $("interests").innerHTML = tags(D.interests);

  /* ---------- contact ---------- */
  const cl = $("contact-links");
  cl.innerHTML = `<span class="email">${esc(P.email)}</span>`;
  cl.appendChild(copyBtn(P.email, "Copy email"));
  [["LinkedIn", P.links.linkedin], ["GitHub", P.links.github], ["Resume", P.links.resume]].forEach(([t, u]) => {
    if (!has(u)) return;
    const a = document.createElement("a"); a.className = "btn"; a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; a.textContent = t;
    cl.appendChild(a);
  });
  $("foot").textContent = `© ${new Date().getFullYear()} ${P.name} · ${P.location}`;
})();
</script>
</body>
</html>
